[project]
name = "letsLearnML"
version = "0.1.0"
description = "yeah"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "riichienv>=0.4.8",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letslearnml"]

[tool.ruff]
line-length = 120
target-version = "py314"
[tool.ruff.lint] 
extend-select = ["N"]
[tool.pytest.ini_options]
testpaths = ["tests"]
